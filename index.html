<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendorSphere - Vendor & Procurement Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>VendorSphere</h1><p>Vendor & Procurement Management System</p></header>
<main>
<section class="card">
<h2>Add / Edit Vendor</h2>
<form id="vendorForm">
<input type="hidden" id="editId">
<input id="name" placeholder="Vendor Name *" required>
<input id="company" placeholder="Company Name *" required>
<input id="product" placeholder="Product / Service *" required>
<input id="phone" placeholder="Phone (10 digit)" maxlength="10">
<input id="email" placeholder="Email">
<input id="value" type="number" placeholder="Contract Value" min="0" step="0.01">
<input id="rating" type="number" placeholder="Rating 0-5" min="0" max="5" step="0.1">
<button type="submit" id="saveBtn">Add Vendor</button>
<button type="button" id="cancelEdit" class="secondary hidden">Cancel Edit</button>
</form>
<p id="msg"></p>
</section>
<section class="card">
<div class="row">
<input id="search" placeholder="Search by name / company / product...">
<select id="filter"><option value="all">All Vendors</option><option value="top">Top Rated (4+)</option></select>
<button id="exportBtn" class="secondary">Export CSV</button>
<button id="clearBtn" class="danger">Clear All</button>
</div>
<div id="stats"></div>
<table><thead><tr><th>ID</th><th>Vendor</th><th>Company</th><th>Product</th><th>Phone</th><th>Value</th><th>Rating</th><th>Action</th></tr></thead>
<tbody id="tbody"></tbody></table>
<p id="empty">No vendors yet. Add your first vendor above.</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
